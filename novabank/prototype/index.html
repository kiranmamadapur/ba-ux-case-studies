<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NovaBank prototype</title><link rel="stylesheet" href="../../shared/style.css"></head><body><header><h1>NovaBank</h1><small>Concept prototype · fictional data · runs in your browser</small></header><main id="m" aria-live="polite"></main><script src="../../shared/app.js"></script><script>
const DIR={"1234567890":"Asha Verma","2345678901":"Ravi Kumar","3456789012":"Meena Shah"},LIM=50000;
let fa="",fi="",fm="",bal=S("nb-bal",120000),used=S("nb-used",0),BN=S("nb-bn",[{n:"Asha Verma",a:"1234567890"}]),TX=S("nb-tx",[{d:"2026-10-02",n:"Ravi Kumar",a:2500},{d:"2026-10-09",n:"Asha Verma",a:12000},{d:"2026-10-21",n:"Meena Shah",a:750}]),v="tr",msg="",err="",pend=null,otp="",q={n:"",min:"",from:""};
const A={v:x=>{v=x;msg=err="";R()},
val:()=>{const a=$("#ac").value.trim(),i=$("#if").value.trim();fa=a;fi=i;err=msg="";pend=null;otp="";if(!/^\d{10}$/.test(a))err="Account number must have 10 digits.";else if(!/^[A-Za-z]{4}0[A-Za-z0-9]{6}$/.test(i))err="IFSC looks wrong. Example: NOVA0001234.";else if(BN.some(b=>b.a==a))err="This beneficiary is already saved.";else if(!DIR[a])err="Account not found. Try 2345678901 or 3456789012.";else{pend={n:DIR[a],a};msg="Account holder: "+DIR[a]+". Confirm the name, then request a code."}R()},
code:()=>{otp=String(Math.floor(100000+Math.random()*900000));msg="Demo code: "+otp+" (a real app would send it by SMS)";R()},
save:()=>{if($("#ot").value.trim()!=otp||!otp){err="Wrong code. Try again.";R();return}BN.push(pend);V("nb-bn",BN);msg="Saved "+pend.n+" as a beneficiary.";err="";pend=null;otp="";R()},
send:()=>{const b=BN[+$("#bn").value],a=+$("#amt").value,rem=LIM-used;fm=$("#amt").value;err=msg="";if(!b)err="Add a beneficiary first.";else if(!(a>0))err="Enter an amount.";else if(a>rem)err=`Daily limit is ${inr(LIM)}. You can send ${inr(rem)} more today.`;else if(a>bal)err="Insufficient balance.";
if(!err){bal-=a;used+=a;TX.unshift({d:new Date().toISOString().slice(0,10),n:b.n,a});V("nb-bal",bal);V("nb-used",used);V("nb-tx",TX);msg=`Sent ${inr(a)} to ${b.n}. Receipt saved in History.`;fm=""}R()},
find:()=>{q={n:$("#qn").value.trim().toLowerCase(),min:$("#qm").value,from:$("#qf").value};R()}};
function R(){let h=`<div class="tabs">${[["tr","Transfer"],["bn","Beneficiaries"],["hi","History"]].map(x=>`<button class="${v==x[0]?"on":""}" data-a="v" data-v="${x[0]}">${x[1]}</button>`).join("")}</div>`;
if(v=="tr")h+=`<div class="c"><h2>Balance ${inr(bal)}</h2><p class="m">Remaining daily limit: ${inr(LIM-used)} of ${inr(LIM)}</p><label>To<select id="bn">${BN.map((b,i)=>`<option value="${i}">${esc(b.n)} (${b.a.slice(-4)})</option>`).join("")}</select></label><label>Amount<input id="amt" type="number" min="1" value="${esc(fm)}"></label><p class="err" role="alert">${err}</p><p class="ok">${msg}</p><button class="p" data-a="send">Send money</button></div>`;
if(v=="bn")h+=`<div class="c"><h2>Add beneficiary</h2><label>Account number<input id="ac" inputmode="numeric" value="${esc(fa)}"></label><label>IFSC<input id="if" value="${esc(fi)}"></label><button data-a="val">Validate account</button><p class="err" role="alert">${err}</p><p class="ok">${msg}</p>${pend?`<button data-a="code">Send one-time code</button>`:""}${otp?`<label>One-time code<input id="ot" inputmode="numeric"></label><button class="p" data-a="save">Confirm and save</button>`:""}</div><div class="c"><h3>Saved</h3>${BN.map(b=>`<div>${esc(b.n)} ····${b.a.slice(-4)}</div>`).join("")}</div>`;
if(v=="hi"){const L=TX.filter(t=>(!q.n||t.n.toLowerCase().includes(q.n))&&(!q.min||t.a>=+q.min)&&(!q.from||t.d>=q.from));h+=`<div class="c"><h2>Search transactions</h2><div class="row"><input id="qn" placeholder="Name" value="${esc(q.n)}" style="max-width:200px"><input id="qm" type="number" placeholder="Min amount" value="${q.min}" style="max-width:160px"><input id="qf" type="date" value="${q.from}" style="max-width:180px"><button class="p" data-a="find">Search</button></div><div class="tw"><table><tr><th>Date</th><th>To</th><th>Amount</th></tr>${L.map(t=>`<tr><td>${t.d}</td><td>${esc(t.n)}</td><td>${inr(t.a)}</td></tr>`).join("")||"<tr><td colspan=3>No matches.</td></tr>"}</table></div></div>`}
$("#m").innerHTML=h}
on(A);R();
</script></body></html>
